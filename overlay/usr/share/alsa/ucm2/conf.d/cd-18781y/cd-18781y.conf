Syntax 6

SectionUseCase."HiFi" {
	File "/Lenovo/cd-18781y/HiFi.conf"
	Comment "Play and record HiFi quality Music"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

BootSequence [
	cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
	cset "name='DEC1 MUX' DMIC1"
	cset "name='DEC2 MUX' DMIC2"
	cset "name='CIC1 MUX' DMIC"
	cset "name='CIC2 MUX' DMIC"
	cset "name='TX1 HPF Cutoff' '75Hz'"
	cset "name='TX2 HPF Cutoff' '75Hz'"
	cset "name='TX1 HPF Switch' 1"
	cset "name='TX2 HPF Switch' 1"
	cset "name='TX1 Digital Volume' 124"
	cset "name='TX2 Digital Volume' 124"
	cset "name='ADC2 MUX' ZERO"
	cset "name='ADC1 Volume' 0"
	cset "name='ADC2 Volume' 0"
	cset "name='ADC3 Volume' 0"
	cset "name='EAR_S' ZERO"
	cset "name='HPHL' ZERO"
	cset "name='HPHR' ZERO"
	cset "name='Headphone Jack Switch' 0"
	cset "name='Mic Jack Switch' 0"
]
